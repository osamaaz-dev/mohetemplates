<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>تصغير صورة وإرسالها</title>
  <style>
    :root {
      --moh-green: #094239;
      --moh-gold: #b8a678;
      --moh-text: #3c3a3b;
      --panel-bg: rgba(255, 255, 255, 0.92);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      direction: rtl;
      text-align: center;
      color: var(--moh-text);
      background: #eeeadf url("images/BG.jpg") center/cover no-repeat fixed;
      font-family: "QomraRegular", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(760px, 100%);
      background: var(--panel-bg);
      border: 2px solid var(--moh-green);
      box-shadow: 0 20px 40px rgba(0,0,0,0.24);
      padding: 28px 24px;
      border-radius: 12px;
    }

    h2 {
      margin: 0 0 12px;
      color: var(--moh-green);
      font-size: clamp(24px, 3vw, 32px);
    }

    .subtitle {
      margin: 0 0 18px;
      font-size: 18px;
      line-height: 1.6;
    }

    input[type="file"] {
      width: min(100%, 520px);
      padding: 10px;
      border: 1px solid #c9c3b2;
      background: #fff;
      margin-bottom: 14px;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      background: var(--moh-gold);
      color: #fff;
      border: none;
      min-width: 220px;
      height: 48px;
      padding: 0 16px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
    }

    button.secondary {
      background: #0088cc;
    }

    button:hover {
      filter: brightness(0.95);
      transform: translateY(-1px);
    }

    .status {
      margin-top: 16px;
      min-height: 24px;
      font-size: 16px;
      color: var(--moh-green);
      font-weight: bold;
    }

    .back-link {
      display: inline-block;
      margin-top: 16px;
      color: var(--moh-green);
      text-decoration: none;
      font-weight: bold;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="app">
    <h2>تصغير صورة</h2>
    <p class="subtitle">اختر صورة واحدة ثم اختر تنزيل الصورة المضغوطة أو إرسالها مباشرة إلى المحادثة</p>
    <input type="file" id="upload" accept="image/*">

    <div class="actions">
      <button id="downloadBtn">تنزيل الصورة المضغوطة</button>
      <button id="sendBtn" class="secondary">إرسال إلى تلغرام</button>
    </div>

    <p id="status" class="status">يرجى اختيار صورة أولًا</p>
    <a href="index.html" class="back-link">العودة إلى الصفحة الرئيسية</a>
  </main>

  <script>
    const BOT_TOKEN = "8320697814:AAGq5UTVDyzTWnL1FmiKHomrgKst7ddVsFM";
    const CHAT_ID = "-5300103442";
    const TARGET_WIDTH = 770;

    function showStatus(message, isError = false) {
      const status = document.getElementById("status");
      status.textContent = message;
      status.style.color = isError ? "#b22222" : "#094239";
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = () => reject(new Error("فشل قراءة الملف"));
        reader.readAsDataURL(file);
      });
    }

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("فشل تحميل الصورة"));
        img.src = src;
      });
    }

    function resizeImageToDataURL(dataURL, targetWidth) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, targetWidth / img.width);
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);

          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.9));
        };
        img.onerror = () => reject(new Error("فشل تصغير الصورة"));
        img.src = dataURL;
      });
    }

    function dataURLToBlob(dataURL) {
      const byteString = atob(dataURL.split(",")[1]);
      const mimeString = dataURL.split(",")[0].split(":")[1].split(";")[0];
      const ab = new ArrayBuffer(byteString.length);
      const ia = new Uint8Array(ab);
      for (let i = 0; i < byteString.length; i++) {
        ia[i] = byteString.charCodeAt(i);
      }
      return new Blob([ab], { type: mimeString });
    }

    async function processAndGetCompressedDataURL(file) {
      const baseSrc = await readFileAsDataURL(file);
      const baseImage = await loadImage(baseSrc);
      const resizedURL = await resizeImageToDataURL(baseSrc, TARGET_WIDTH);
      return { baseImage, resizedURL };
    }

    async function downloadCompressedImage() {
      const file = document.getElementById("upload").files[0];
      if (!file) {
        showStatus("يرجى اختيار صورة أولًا", true);
        return;
      }

      try {
        showStatus("جاري تصغير الصورة...");
        const { resizedURL } = await processAndGetCompressedDataURL(file);
        const blob = dataURLToBlob(resizedURL);
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `compressed_${file.name.replace(/\.[^.]+$/, "")}.jpg`;
        link.click();
        URL.revokeObjectURL(url);
        showStatus("تم تنزيل الصورة المضغوطة بنجاح");
      } catch (error) {
        showStatus(error.message || "حدث خطأ أثناء التصغير", true);
      }
    }

    async function sendCompressedImageToTelegram() {
      const file = document.getElementById("upload").files[0];
      if (!file) {
        showStatus("يرجى اختيار صورة أولًا", true);
        return;
      }

      try {
        showStatus("جاري التحضير والإرسال...");
        const { resizedURL } = await processAndGetCompressedDataURL(file);
        const blob = dataURLToBlob(resizedURL);

        const formData = new FormData();
        formData.append("chat_id", CHAT_ID);
        formData.append("photo", blob, `compressed_${file.name.replace(/\.[^.]+$/, "")}.jpg`);
        formData.append("caption", `تم تصغير الصورة إلى عرض ${TARGET_WIDTH}px`);

        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
          method: "POST",
          body: formData
        });

        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.description || "فشل إرسال الصورة");
        }

        showStatus("تم إرسال الصورة المضغوطة إلى تلغرام بنجاح");
      } catch (error) {
        showStatus(error.message || "حدث خطأ أثناء الإرسال", true);
      }
    }

    document.getElementById("downloadBtn").addEventListener("click", downloadCompressedImage);
    document.getElementById("sendBtn").addEventListener("click", sendCompressedImageToTelegram);
  </script>
</body>
</html>
